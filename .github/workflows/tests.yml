name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://memory:memory@127.0.0.1:54329/memory
      # 没有 key 时抽取走内置规则、向量列留空，测试不依赖外部 API
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test
        run: python -m pytest -q

      - name: Schema reaches the service container
        run: |
          python - <<'PY'
          import psycopg, sys
          sys.path.insert(0, "src")
          from memory_kernel.config import load_settings
          from memory_kernel.db import connect
          conn = connect(load_settings().database_url)
          n = conn.execute("select count(*) as n from pg_tables where schemaname='public'").fetchone()["n"]
          print(f"public tables: {n}")
          assert n >= 5, "schema 没建起来"
          PY
