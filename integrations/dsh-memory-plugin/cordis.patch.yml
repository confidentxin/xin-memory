# Installed by `dsh plugin add`. Do not also --patch the same id.
- insert:
    - id: memory-kernel-plugin
      name: '@memory-kernel/dsh-memory'
      config:
        kernelUrl: !!js process.env.KERNEL_URL || 'http://127.0.0.1:8741'
        userId: !!js process.env.MEMORY_USER_ID || 'default'
        agentId: !!js process.env.MEMORY_AGENT_ID || ''
        budget: !!js Number(process.env.MEMORY_BUDGET || 1200)
        autoExtract: true
