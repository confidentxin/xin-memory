[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-kernel"
version = "0.1.0"
description = "一期自托管记忆内核：L0 Episode、L1 Fact、L2 Profile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memory-kernel = "memory_kernel.cli:main"
memory-kernel-mcp = "memory_kernel.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_kernel = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
